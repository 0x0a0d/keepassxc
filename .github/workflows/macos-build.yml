name: macOS Build

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  build-macos-intel:
    name: Build for macOS Intel (x86_64)
    runs-on: macos-13

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg-tool
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build dependencies
        run: |
          brew install cmake ninja asciidoctor pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-macos-intel-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-macos-intel-

      - name: Set up vcpkg
        run: |
          # Clone vcpkg to a separate directory (not the repo's vcpkg folder which contains triplets)
          git clone https://github.com/Microsoft/vcpkg.git $VCPKG_ROOT
          cd $VCPKG_ROOT
          # Checkout the baseline specified in vcpkg.json
          git checkout f9c128a6f7a96f5fa2f6f089f37ed6788a90e4b0
          ./bootstrap-vcpkg.sh
          cd ..
          mkdir -p $VCPKG_DEFAULT_BINARY_CACHE

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/vcpkg/triplets \
            -DVCPKG_TARGET_TRIPLET=x64-osx-dynamic-release \
            -DWITH_XC_ALL=ON \
            -DWITH_TESTS=ON \
            -DWITH_GUI_TESTS=ON \
            -DKEEPASSXC_BUILD_TYPE=Release \
            ..

      - name: Build KeePassXC
        run: |
          cd build
          cmake --build . --parallel $(sysctl -n hw.ncpu)

#      - name: Run tests
#        run: |
#          cd build
#          export ASAN_OPTIONS=detect_leaks=0
#          ctest --output-on-failure --parallel $(sysctl -n hw.ncpu)

      - name: Package application
        run: |
          cd build
          cmake --build . --target package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-macOS-Intel
          path: |
            build/*.dmg
            build/*.zip
          retention-days: 30

      - name: Upload application bundle
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-macOS-Intel-App
          path: build/src/KeePassXC.app
          retention-days: 7

